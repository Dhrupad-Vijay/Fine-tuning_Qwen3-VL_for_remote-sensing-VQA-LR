[project]
name = "satellite-proj"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.14,<2.15",
    "torchvision",
    "transformers>=4.57",
    "accelerate",
    "sentencepiece",
    "protobuf",
    "huggingface_hub",
    "qwen-vl-utils",
    "peft",
    "trl",
    "datasets",
    "scikit-learn",
    "matplotlib",
    "pandas",
    "pillow",
    "pyyaml",
    "requests",
    "tqdm",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
